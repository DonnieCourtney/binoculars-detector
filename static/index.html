<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binoculars — AI Text Detector</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #00ff88;
    --danger: #ff4444;
    --warn: #ffaa00;
    --human: #00ff88;
    --ai: #ff4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 2rem;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  main {
    width: 100%;
    max-width: 800px;
    padding: 2rem;
    flex: 1;
  }

  textarea {
    width: 100%;
    min-height: 300px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 1rem;
    line-height: 1.7;
    padding: 1.5rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); }

  textarea::placeholder { color: var(--text-dim); }

  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 1rem;
  }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.7rem 2rem;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.15s;
  }

  button:hover {
    background: var(--accent);
    color: var(--bg);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .char-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  #result {
    margin-top: 2rem;
    display: none;
  }

  .result-card {
    border: 1px solid var(--border);
    padding: 2rem;
    background: var(--surface);
  }

  .verdict {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .verdict.human { color: var(--human); }
  .verdict.ai { color: var(--ai); }
  .verdict.unknown { color: var(--warn); }

  .score-row {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-top: 1rem;
    font-family: 'JetBrains Mono', monospace;
  }

  .score-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .score-value {
    font-size: 1.4rem;
    font-weight: 700;
  }

  .meter {
    width: 100%;
    height: 4px;
    background: var(--border);
    margin-top: 1.5rem;
    position: relative;
  }

  .meter-fill {
    height: 100%;
    transition: width 0.6s ease, background 0.3s;
  }

  .meter-threshold {
    position: absolute;
    top: -6px;
    width: 2px;
    height: 16px;
    background: var(--text-dim);
  }

  .meter-threshold-label {
    position: absolute;
    top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-dim);
    transform: translateX(-50%);
  }

  .details {
    margin-top: 1.5rem;
    font-size: 0.9rem;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .confidence-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 0.2rem 0.6rem;
    border: 1px solid;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-left: 1rem;
    vertical-align: middle;
  }

  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    padding: 1.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    text-align: center;
    border-top: 1px solid var(--border);
    width: 100%;
  }

  footer a { color: var(--text-dim); }
</style>
</head>
<body>
  <header>
    <h1><span>&#x1f52d;</span> binoculars</h1>
    <div class="subtitle">Statistical AI Text Detection</div>
  </header>

  <main>
    <textarea id="input" placeholder="Paste text here to analyze..."></textarea>
    <div class="controls">
      <button id="analyze" onclick="detect()">Analyze</button>
      <div class="spinner" id="spinner"></div>
      <span class="char-count" id="charcount">0 chars</span>
    </div>

    <div id="result">
      <div class="result-card">
        <div>
          <span class="verdict" id="verdict"></span>
          <span class="confidence-badge" id="confidence"></span>
        </div>
        <div class="score-row">
          <div>
            <div class="score-label">Score</div>
            <div class="score-value" id="score"></div>
          </div>
          <div>
            <div class="score-label">Threshold</div>
            <div class="score-value" id="threshold" style="color: var(--text-dim);"></div>
          </div>
        </div>
        <div class="meter">
          <div class="meter-fill" id="meterFill"></div>
          <div class="meter-threshold" id="meterThreshold">
            <div class="meter-threshold-label">threshold</div>
          </div>
        </div>
        <div class="details" id="details"></div>
      </div>
    </div>
  </main>

  <footer>
    Based on <a href="https://github.com/ahans30/Binoculars">Binoculars</a> (ICML 2024)
    &mdash; perplexity ratio between observer/performer LLMs
  </footer>

<script>
const input = document.getElementById('input');
const charcount = document.getElementById('charcount');

input.addEventListener('input', () => {
  charcount.textContent = input.value.length + ' chars';
});

async function detect() {
  const text = input.value.trim();
  if (text.length < 50) {
    alert('Need at least 50 characters');
    return;
  }

  const btn = document.getElementById('analyze');
  const spinner = document.getElementById('spinner');
  btn.disabled = true;
  spinner.style.display = 'block';

  try {
    const res = await fetch('/api/detect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();

    const result = document.getElementById('result');
    const verdict = document.getElementById('verdict');
    const score = document.getElementById('score');
    const threshold = document.getElementById('threshold');
    const confidence = document.getElementById('confidence');
    const details = document.getElementById('details');
    const meterFill = document.getElementById('meterFill');
    const meterThreshold = document.getElementById('meterThreshold');

    result.style.display = 'block';

    if (data.prediction === 'human_written') {
      verdict.textContent = 'Human Written';
      verdict.className = 'verdict human';
    } else if (data.prediction === 'ai_generated') {
      verdict.textContent = 'AI Generated';
      verdict.className = 'verdict ai';
    } else {
      verdict.textContent = 'Insufficient Text';
      verdict.className = 'verdict unknown';
    }

    score.textContent = data.score.toFixed(4);
    threshold.textContent = data.threshold.toFixed(4);

    confidence.textContent = data.confidence + ' confidence';
    confidence.style.borderColor =
      data.confidence === 'high' ? (data.prediction === 'human_written' ? 'var(--human)' : 'var(--ai)') : 'var(--warn)';
    confidence.style.color = confidence.style.borderColor;

    // Meter: score range roughly 0.5 to 1.3
    const minS = 0.5, maxS = 1.3;
    const pct = Math.max(0, Math.min(100, ((data.score - minS) / (maxS - minS)) * 100));
    const threshPct = ((data.threshold - minS) / (maxS - minS)) * 100;
    meterFill.style.width = pct + '%';
    meterFill.style.background = data.prediction === 'human_written' ? 'var(--human)' : 'var(--ai)';
    meterThreshold.style.left = threshPct + '%';

    details.textContent = data.details;
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}
</script>
</body>
</html>
